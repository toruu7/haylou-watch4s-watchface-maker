name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile all Python sources
        run: python -m compileall -q scripts studio
      - name: Studio backend smoke test
        run: |
          python - <<'PY'
          import importlib.util, os, sys
          sys.path.insert(0, os.path.join(os.getcwd(), "scripts"))
          spec = importlib.util.spec_from_file_location("studio_server", os.path.join("studio", "server.py"))
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.safe_preset_dir("ok_id").endswith("ok_id")
          for bad in ("../etc", "C:\\Windows", "/tmp", "", ".", "a/b"):
              assert m.safe_preset_dir(bad) is None, bad
          assert m.valid_bin(bytes.fromhex("0200ffff00000000" + "00" * 8))
          assert not m.valid_bin(b"not a dial")
          print("backend helpers OK")
          PY
